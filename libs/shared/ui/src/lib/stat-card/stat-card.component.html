<p-card styleClass="ssrk-stat-card">
  <div class="ssrk-stat-card__body text-center">
    <p
      class="ssrk-stat-card__value font-serif font-bold leading-none text-white"
      [class.ssrk-stat-card__value--compact]="data().valueSize === 'compact'"
    >
      {{ data().value }}
      @if (data().accent) {
        @if (data().accentPosition === 'inline') {
          <span class="text-ssrk-saffron-light"> {{ data().accent }}</span>
        } @else {
          <span class="text-ssrk-saffron-light">{{ data().accent }}</span>
        }
      }
    </p>
    <p class="ssrk-stat-card__label mt-1 text-[10.5px] font-semibold uppercase tracking-wide text-white/70">
      {{ data().label }}
    </p>
  </div>
</p-card>

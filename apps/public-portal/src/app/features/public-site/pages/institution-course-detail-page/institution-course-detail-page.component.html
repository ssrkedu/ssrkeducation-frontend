<section class="mx-auto max-w-[1240px] px-4 py-16 lg:px-8">
  <a routerLink="/courses" class="text-sm font-semibold text-ssrk-blue-primary hover:underline">
    ← Back to courses
  </a>

  @if (course(); as courseDetail) {
    <p class="mt-6 text-xs font-bold uppercase tracking-[0.25em] text-ssrk-blue-primary">
      {{ site()?.name }}
    </p>
    <h1 class="mt-2 font-serif text-3xl font-bold text-ssrk-text-heading">
      {{ courseDetail.name }}
    </h1>
    <p class="mt-4 max-w-3xl text-sm leading-relaxed text-ssrk-text-body">
      {{ courseDetail.description }}
    </p>
  } @else {
    <h1 class="mt-6 font-serif text-2xl font-bold text-ssrk-text-heading">
      Course not found
    </h1>
    <p class="mt-2 text-sm text-ssrk-text-muted">
      This course is not available for the current institution.
    </p>
  }
</section>

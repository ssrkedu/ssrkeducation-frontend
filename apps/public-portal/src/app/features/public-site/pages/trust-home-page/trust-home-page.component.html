<app-hero-carousel [slides]="heroSlides" />

<app-stats-bar
  [items]="statsBar.items"
  [footnote]="statsBar.footnote"
  [ariaLabel]="statsBar.ariaLabel ?? 'Key statistics'"
/>

<app-trust-about-section [content]="about" />

<section id="institutions" class="mx-auto max-w-[1240px] px-4 py-16 lg:px-8">
  <div class="text-center">
    <p class="text-xs font-bold uppercase tracking-[0.25em] text-ssrk-blue-primary">
      Our Institutions
    </p>
    <h2 class="mt-2 font-serif text-3xl font-bold text-ssrk-text-heading">
      Explore SSRK Colleges
    </h2>
    <p class="mx-auto mt-3 max-w-xl text-sm text-ssrk-text-muted">
      Degree college, junior college, and more — find the right fit for your goals.
    </p>
  </div>
</section>

<section id="enquiry" class="bg-ssrk-bg px-4 py-16 lg:px-8">
  <div class="mx-auto max-w-[1240px] text-center">
    <p class="text-xs font-bold uppercase tracking-[0.25em] text-ssrk-blue-primary">
      Admissions
    </p>
    <h2 class="mt-2 font-serif text-3xl font-bold text-ssrk-text-heading">
      Start Your Enquiry
    </h2>
    <p class="mx-auto mt-3 max-w-xl text-sm text-ssrk-text-muted">
      Enquiry form and scholarship details will appear here in a later phase.
    </p>
  </div>
</section>

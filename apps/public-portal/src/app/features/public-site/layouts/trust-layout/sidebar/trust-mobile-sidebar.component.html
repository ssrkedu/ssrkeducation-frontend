<div
  class="fixed inset-0 z-[999] overflow-y-auto bg-white pt-20 transition-transform duration-[350ms] ease-[cubic-bezier(0.4,0,0.2,1)] lg:hidden"
  [class.pointer-events-none]="!isOpen()"
  [class.translate-x-full]="!isOpen()"
  [class.pointer-events-auto]="isOpen()"
  [class.translate-x-0]="isOpen()"
  role="dialog"
  aria-label="Mobile navigation"
  [attr.aria-hidden]="!isOpen()"
>
  <button
    type="button"
    class="absolute right-3.5 top-3.5 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-ssrk-bg text-[26px] text-ssrk-text-heading"
    aria-label="Close menu"
    (click)="close()"
  >
    ✕
  </button>

  <nav class="px-5 pb-10">
    <div class="mb-4 flex gap-2">
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-sm border-[1.5px] px-2 py-2.5 text-[13px] font-bold transition"
        [class.border-ssrk-blue-primary]="activeLanguage() === 'en'"
        [class.bg-ssrk-blue-primary]="activeLanguage() === 'en'"
        [class.text-white]="activeLanguage() === 'en'"
        [class.border-ssrk-border]="activeLanguage() !== 'en'"
        [class.text-ssrk-text-muted]="activeLanguage() !== 'en'"
        (click)="setLanguage('en')"
      >
        English
      </button>
      <button
        type="button"
        class="flex-1 cursor-pointer rounded-sm border-[1.5px] px-2 py-2.5 text-[13px] font-bold transition"
        style="font-family: 'Noto Sans Oriya', 'Noto Sans', sans-serif"
        [class.border-ssrk-blue-primary]="activeLanguage() === 'od'"
        [class.bg-ssrk-blue-primary]="activeLanguage() === 'od'"
        [class.text-white]="activeLanguage() === 'od'"
        [class.border-ssrk-border]="activeLanguage() !== 'od'"
        [class.text-ssrk-text-muted]="activeLanguage() !== 'od'"
        (click)="setLanguage('od')"
      >
        ଓଡ଼ିଆ
      </button>
    </div>

    @for (link of navLinks; track link.label) {
      @if (link.children?.length) {
        <div class="border-b border-ssrk-border">
          <button
            type="button"
            class="flex w-full cursor-pointer items-center justify-between border-none bg-transparent py-4 text-left text-base font-semibold text-ssrk-text-heading"
            (click)="toggleInstitutions()"
          >
            {{ link.label }}
            <span [class.rotate-180]="institutionsExpanded()">▾</span>
          </button>
          @if (institutionsExpanded()) {
            <div class="pb-2 pl-4">
              @for (child of institutionLinks; track child.label) {
                <a
                  [href]="child.href"
                  class="block border-b border-ssrk-bg py-2.5 text-sm text-ssrk-text-body"
                  (click)="onNavigate()"
                >
                  {{ child.label }}
                </a>
              }
            </div>
          }
        </div>
      } @else {
        <div class="border-b border-ssrk-border">
          <a
            [href]="link.href"
            class="flex items-center justify-between py-4 text-base font-semibold text-ssrk-text-heading"
            (click)="onNavigate()"
          >
            {{ link.label }}
          </a>
        </div>
      }
    }

    <a
      href="#enquiry"
      class="mt-6 block rounded-sm bg-ssrk-blue-primary py-3.5 text-center text-[15px] font-bold text-white"
      (click)="onNavigate()"
    >
      Enquire / Apply Now
    </a>

    <div class="-mx-5 mt-6 bg-ssrk-bg px-5 py-5">
      <p class="mb-1.5 flex items-center gap-2 text-[13px] text-ssrk-text-muted">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#1A5276" aria-hidden="true">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
          />
        </svg>
        {{ contact.mobilePhone }}
      </p>
      <p class="flex items-center gap-2 text-[13px] text-ssrk-text-muted">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#1A5276" aria-hidden="true">
          <path
            d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
          />
        </svg>
        {{ contact.mobileEmail }}
      </p>
    </div>
  </nav>
</div>

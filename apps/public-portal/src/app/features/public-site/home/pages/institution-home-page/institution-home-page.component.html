@let vm = viewModel();

@if (vm.status === 'loading') {
  <div class="flex min-h-[40vh] items-center justify-center px-4">
    <app-loader />
  </div>
} @else if (vm.status === 'error') {
  <div class="mx-auto max-w-[1240px] px-4 py-16 text-center text-ssrk-text-body">
    <p>{{ vm.errorMessage }}</p>
  </div>
} @else {
  @if (vm.heroSlides?.length) {
    <app-hero-carousel [slides]="vm.heroSlides!" />
  }

  <app-institution-overview-section [content]="vm.overview!" />

  <app-institution-courses-section
    [content]="vm.coursesSection!"
    [applyNowUrl]="applyNowUrl"
  />

  <app-institution-scholarships-section
    [content]="vm.scholarshipsSection!"
    [applyNowUrl]="applyNowUrl"
  />
}

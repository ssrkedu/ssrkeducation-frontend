@let vm = viewModel();

@if (vm.status === 'loading') {
  <div class="flex min-h-[40vh] items-center justify-center px-4">
    <app-loader />
  </div>
} @else if (vm.status === 'error') {
  <div class="mx-auto max-w-[1240px] px-4 py-16 text-center text-ssrk-text-body">
    <p>{{ vm.errorMessage }}</p>
  </div>
} @else {
  <app-announcement-ticker
    [items]="vm.announcements!.items"
    [label]="vm.announcements!.label ?? 'LATEST'"
    [ariaLabel]="vm.announcements!.ariaLabel ?? 'Latest announcements'"
  />

  <app-hero-carousel [slides]="vm.heroSlides!" />

  <app-stats-bar
    [items]="vm.statsBar!.items"
    [ariaLabel]="vm.statsBar!.ariaLabel ?? 'Why choose SSRK'"
  />

  <app-trust-about-section [content]="vm.about!" />

  <app-trust-institutions-section [content]="vm.institutions!" />

  <app-trust-enquiry-section
    [content]="vm.enquirySection!"
    [collegeOptions]="vm.enquiryCollegeOptions!"
  />

  <p-scrollTop
    [threshold]="400"
    behavior="smooth"
    buttonAriaLabel="Scroll to top"
    styleClass="ssrk-scroll-top"
  />
}

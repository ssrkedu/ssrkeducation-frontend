<app-announcement-ticker
  [items]="announcements.items"
  [label]="announcements.label ?? 'LATEST'"
  [ariaLabel]="announcements.ariaLabel ?? 'Latest announcements'"
/>

<app-hero-carousel [slides]="heroSlides" />

<app-stats-bar
  [items]="statsBar.items"
  [ariaLabel]="statsBar.ariaLabel ?? 'Why choose SSRK'"
/>

<app-trust-about-section [content]="about" />

<app-trust-institutions-section [content]="institutions()" />

<app-trust-enquiry-section [collegeOptions]="enquiryCollegeOptions()" />

<p-scrollTop
  [threshold]="400"
  behavior="smooth"
  buttonAriaLabel="Scroll to top"
  styleClass="ssrk-scroll-top"
/>

@let section = content();

<section
  id="enquiry"
  class="ssrk-enquiry-section relative w-full max-w-full overflow-x-clip bg-gradient-to-br from-ssrk-blue-deep to-ssrk-blue-primary px-4 py-16 md:py-[88px] sm:px-6 lg:px-8"
  aria-labelledby="enquiry-heading"
>
  <div class="pointer-events-none absolute -right-24 -top-24 h-[360px] w-[360px] rounded-full border-[80px] border-white/5" aria-hidden="true"></div>
  <div class="pointer-events-none absolute bottom-[-70px] left-[15%] h-[240px] w-[240px] rounded-full border-[60px] border-white/[0.04]" aria-hidden="true"></div>

  <!-- minmax(0, 1fr) so the track can shrink below form min-content on small screens -->
  <div
    class="relative z-[1] mx-auto grid w-full min-w-0 max-w-[1240px] grid-cols-[minmax(0,1fr)] gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,420px)] lg:items-center lg:gap-16"
  >
    <div class="min-w-0 max-w-full">
      <p class="text-xs font-bold uppercase tracking-[0.25em] text-white/65">
        {{ section.sectionLabel }}
      </p>
      <h2
        id="enquiry-heading"
        class="mt-2 max-w-full break-words font-serif text-[clamp(22px,4vw,34px)] font-bold leading-tight text-white"
      >
        {{ section.title }}
      </h2>
      <p class="mt-3 max-w-full break-words text-[15px] leading-relaxed text-white/80">
        {{ section.description }}
      </p>

      <ul class="mt-6 flex min-w-0 max-w-full flex-col gap-2.5">
        @for (highlight of section.highlights; track highlight) {
          <li class="flex min-w-0 max-w-full items-start gap-2.5 text-sm text-white/88">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-ssrk-saffron-light" aria-hidden="true"></span>
            <span class="min-w-0 flex-1 break-words">{{ highlight }}</span>
          </li>
        }
      </ul>
    </div>

    <div class="min-w-0 max-w-full">
      <app-enquiry-form
        [collegeOptions]="collegeOptions()"
        [interestOptions]="interestOptions()"
        [initialCollegeCode]="initialCollegeCode()"
        [submitting]="submitting()"
        [submitSuccess]="submitSuccess()"
        [errorMessage]="submitError()"
        (submitted)="onSubmitted($event)"
      />
    </div>
  </div>
</section>

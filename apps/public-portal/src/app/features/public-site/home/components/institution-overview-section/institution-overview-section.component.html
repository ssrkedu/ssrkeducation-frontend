@let section = content();

<section id="overview" class="w-full max-w-full overflow-x-clip bg-white py-16 md:py-[72px]">
  <div class="mx-auto w-full min-w-0 max-w-[1240px] px-4 sm:px-6 lg:px-8">
    <p class="text-xs font-bold uppercase tracking-[0.25em] text-ssrk-blue-primary">
      {{ section.sectionLabel }}
    </p>
    <h2 class="mt-2 max-w-full break-words font-serif text-[clamp(22px,4vw,32px)] font-bold leading-tight text-ssrk-text-heading">
      {{ section.title }}
    </h2>
    <p class="mt-4 max-w-3xl break-words text-[15px] leading-[1.8] text-ssrk-text-body">
      {{ section.description }}
    </p>
  </div>
</section>

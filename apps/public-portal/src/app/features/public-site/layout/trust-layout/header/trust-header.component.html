<header #headerRef class="fixed inset-x-0 top-0 z-50 max-w-full border-b border-ssrk-border bg-white shadow-sm">
  <div class="mx-auto flex min-h-[70px] w-full min-w-0 max-w-[1240px] items-center justify-between gap-3 px-4 py-2.5 lg:px-8">
    <a
      routerLink="/"
      class="flex min-w-0 max-w-[calc(100%-6.5rem)] flex-1 items-center gap-2.5 sm:gap-3 lg:max-w-[300px] xl:max-w-[360px]"
    >
      <div
        class="flex h-[50px] w-[50px] shrink-0 items-center justify-center rounded-[10px] bg-ssrk-blue-primary font-serif text-lg font-bold text-white"
      >
        S
      </div>
      <div class="min-w-0 flex-1">
        <p class="break-words font-serif text-base font-bold leading-tight text-ssrk-blue-primary sm:text-lg">
          {{ site()?.name }}
        </p>
        <p class="mt-0.5 break-words text-[10px] font-medium uppercase leading-snug tracking-wide text-ssrk-text-muted">
          {{ site()?.tagline }}
        </p>
      </div>
    </a>

    <nav class="hidden min-w-0 flex-1 flex-nowrap items-center justify-end gap-0.5 whitespace-nowrap text-[13.5px] font-semibold text-ssrk-text-heading xl:gap-1 lg:flex">
      <a
        routerLink="/"
        routerLinkActive="bg-ssrk-blue-light text-ssrk-blue-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shrink-0 rounded-ssrk-sm px-2.5 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary xl:px-3"
      >
        Home
      </a>
      <a href="#about" class="shrink-0 rounded-ssrk-sm px-2.5 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary xl:px-3">
        About Us
      </a>
      <div class="group relative shrink-0">
        <a
          routerLink="/institutions"
          routerLinkActive="bg-ssrk-blue-light text-ssrk-blue-primary"
          class="flex items-center gap-1 rounded-ssrk-sm px-2.5 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary xl:px-3"
        >
          Institutions
          <span class="text-[9px] transition-transform group-hover:rotate-180">▾</span>
        </a>
        <ul
          class="invisible absolute left-0 top-[calc(100%+4px)] z-50 min-w-[230px] translate-y-1.5 rounded-ssrk-md border-t-[3px] border-ssrk-blue-primary bg-white p-2 opacity-0 shadow-lg transition-all group-hover:visible group-hover:translate-y-0 group-hover:opacity-100"
        >
          <li>
            <a
              routerLink="/institutions"
              class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary"
            >
              All Institutions
            </a>
          </li>
          <li>
            <a [href]="degreeCollegeUrl" class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary">
              Sri Sai Rama Krishna Degree College
            </a>
          </li>
          <li>
            <a [href]="juniorCollegeUrl" class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary">
              Sri Sai Rama Krishna Junior College (+2)
            </a>
          </li>
        </ul>
      </div>
      <a href="#" class="shrink-0 rounded-ssrk-sm px-2.5 py-2 hover:bg-ssrk-blue-primary hover:text-white xl:px-3">
        Admin Portal
      </a>
      <app-lang-toggle
        class="ml-1 shrink-0 xl:ml-1.5"
        [value]="siteLanguage.language()"
        (valueChange)="siteLanguage.setLanguage($event)"
      />
      <a
        href="#enquiry"
        class="ml-1 shrink-0 rounded-ssrk-sm bg-ssrk-blue-primary px-4 py-2 font-bold text-white hover:bg-ssrk-blue-deep xl:ml-1.5 xl:px-5"
      >
        Enquire Now
      </a>
    </nav>

    <div class="flex shrink-0 items-center gap-2.5 lg:hidden">
      <app-lang-toggle
        [value]="siteLanguage.language()"
        (valueChange)="siteLanguage.setLanguage($event)"
      />
      <app-mobile-nav-hamburger buttonClass="" />
    </div>
  </div>
</header>
<div class="shrink-0" [style.height.px]="headerSpacerHeight()" aria-hidden="true"></div>

<header #headerRef class="fixed inset-x-0 top-0 z-50 border-b border-ssrk-border bg-white shadow-sm">
  <div class="mx-auto flex min-h-[70px] max-w-[1240px] items-center justify-between gap-3 px-4 py-2 lg:px-8">
    <a routerLink="/" class="flex min-w-0 flex-1 items-center gap-3">
      <div
        class="flex h-[50px] w-[50px] shrink-0 items-center justify-center rounded-[10px] bg-ssrk-blue-primary font-serif text-lg font-bold text-white"
      >
        S
      </div>
      <div class="min-w-0">
        <p class="font-serif text-lg font-bold leading-snug text-ssrk-blue-primary">
          {{ site()?.name }}
        </p>
        <p class="mt-0.5 text-[10px] font-medium uppercase leading-snug tracking-wide text-ssrk-text-muted">
          {{ site()?.tagline }}
        </p>
      </div>
    </a>

    <nav class="hidden flex-1 items-center justify-end gap-1 text-[13.5px] font-semibold text-ssrk-text-heading lg:flex">
      <a
        routerLink="/"
        routerLinkActive="bg-ssrk-blue-light text-ssrk-blue-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-ssrk-sm px-3 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary"
      >
        Home
      </a>
      <a href="#about" class="rounded-ssrk-sm px-3 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary">
        About Us
      </a>
      <div class="group relative">
        <a
          routerLink="/institutions"
          routerLinkActive="bg-ssrk-blue-light text-ssrk-blue-primary"
          class="flex items-center gap-1 rounded-ssrk-sm px-3 py-2 hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary"
        >
          Institutions
          <span class="text-[9px] transition-transform group-hover:rotate-180">▾</span>
        </a>
        <ul
          class="invisible absolute left-0 top-[calc(100%+4px)] z-50 min-w-[230px] translate-y-1.5 rounded-ssrk-md border-t-[3px] border-ssrk-blue-primary bg-white p-2 opacity-0 shadow-lg transition-all group-hover:visible group-hover:translate-y-0 group-hover:opacity-100"
        >
          <li>
            <a
              routerLink="/institutions"
              class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary"
            >
              All Institutions
            </a>
          </li>
          <li>
            <a href="#" class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary">
              Sri Sai Rama Krishna Degree College
            </a>
          </li>
          <li>
            <a href="#" class="block rounded-md px-3 py-2 text-[13px] font-medium text-ssrk-text-body hover:bg-ssrk-blue-light hover:text-ssrk-blue-primary">
              Sri Sai Rama Krishna Junior College (+2)
            </a>
          </li>
        </ul>
      </div>
      <a href="#" class="rounded-ssrk-sm px-3 py-2 hover:bg-ssrk-blue-primary hover:text-white">
        Admin Portal
      </a>
      <app-lang-toggle
        class="ml-1.5"
        [value]="siteLanguage.language()"
        (valueChange)="siteLanguage.setLanguage($event)"
      />
      <a
        href="#enquiry"
        class="ml-1.5 rounded-ssrk-sm bg-ssrk-blue-primary px-5 py-2 font-bold text-white hover:bg-ssrk-blue-deep"
      >
        Enquire Now
      </a>
    </nav>

    <div class="flex shrink-0 items-center gap-2.5 lg:hidden">
      <app-lang-toggle
        [value]="siteLanguage.language()"
        (valueChange)="siteLanguage.setLanguage($event)"
      />
      <app-mobile-nav-hamburger buttonClass="" />
    </div>
  </div>
</header>
<div class="shrink-0" [style.height.px]="headerSpacerHeight()" aria-hidden="true"></div>

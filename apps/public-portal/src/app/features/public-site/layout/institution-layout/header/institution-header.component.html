<header class="sticky top-0 z-50 border-b border-ssrk-border bg-white shadow-sm">
  <div class="mx-auto flex min-h-[70px] max-w-[1240px] items-center justify-between gap-3 px-4 py-2.5 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <a routerLink="/" class="shrink-0">
        <img
          class="ssrk-site-logo"
          [src]="logoSrc()"
          [alt]="logoAlt()"
          width="56"
          height="56"
          decoding="async"
        />
      </a>
      <div class="min-w-0">
        <a
          routerLink="/"
          class="block truncate font-serif text-lg font-bold leading-none text-ssrk-blue-primary"
        >
          {{ site()?.name }}
        </a>
        <a
          class="mt-1 inline-block text-[11px] font-semibold text-ssrk-blue-primary underline underline-offset-2 transition hover:text-ssrk-blue-deep"
          [href]="trustSiteUrl"
        >
          Part of SSRK Educational Trust
        </a>
      </div>
    </div>

    <nav class="hidden items-center gap-6 text-sm font-semibold text-ssrk-text-body lg:flex">
      <a
        routerLink="/"
        routerLinkActive="text-ssrk-blue-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-ssrk-blue-primary"
      >
        Home
      </a>
      @if (siteContext.isPageEnabled('courses')) {
        <a
          routerLink="/courses"
          routerLinkActive="text-ssrk-blue-primary"
          class="hover:text-ssrk-blue-primary"
        >
          Courses
        </a>
      }
      @if (siteContext.isPageEnabled('scholarships')) {
        <a
          routerLink="/scholarships"
          routerLinkActive="text-ssrk-blue-primary"
          class="hover:text-ssrk-blue-primary"
        >
          Scholarships
        </a>
      }
      @if (siteContext.isPageEnabled('gallery')) {
        <a
          routerLink="/gallery"
          routerLinkActive="text-ssrk-blue-primary"
          class="hover:text-ssrk-blue-primary"
        >
          Gallery
        </a>
      }
      @if (enquireNowUrl()) {
        <a
          class="ml-1 shrink-0 rounded-ssrk-sm bg-ssrk-blue-primary px-4 py-2 font-bold text-white hover:bg-ssrk-blue-deep xl:px-5"
          [href]="enquireNowUrl()!"
        >
          Enquire Now
        </a>
      }
    </nav>

    <div class="flex shrink-0 items-center lg:hidden">
      <app-mobile-nav-hamburger />
    </div>
  </div>
</header>

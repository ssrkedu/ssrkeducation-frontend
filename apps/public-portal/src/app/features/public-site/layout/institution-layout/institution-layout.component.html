<div
  class="flex min-h-screen w-full min-w-0 max-w-full flex-col overflow-x-clip transition-[padding] duration-300"
  [class.ssrk-layout--enquire-bar]="!!mobileEnquireConfig() && enquireService.barVisible()"
>
  <app-institution-header />

  <app-mobile-nav-drawer [config]="mobileNavConfig()" />

  <main class="min-w-0 max-w-full flex-1 overflow-x-clip">
    <router-outlet />
  </main>

  <app-institution-footer />

  @if (mobileEnquireConfig(); as enquireConfig) {
    <app-mobile-enquire-bar [config]="enquireConfig" />
  }
</div>

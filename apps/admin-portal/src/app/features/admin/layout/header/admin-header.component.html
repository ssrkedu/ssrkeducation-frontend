<header
  class="sticky top-0 z-30 flex h-[60px] items-center gap-4 border-b border-ssrk-border bg-white px-4 shadow-[0_1px_2px_rgba(13,35,64,0.04),0_3px_10px_rgba(13,35,64,0.07)] sm:px-8"
>
  <div class="shrink-0 lg:hidden">
    <p-button
      type="button"
      icon="pi pi-bars"
      styleClass="admin-header-menu-btn"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      ariaLabel="Open navigation"
      (onClick)="onMenuToggle()"
    />
  </div>

  <h1 class="min-w-0 flex-1 font-serif text-base font-bold text-ssrk-text-heading">{{ title() }}</h1>

  @if (newEnquiryCount() > 0) {
    <span class="rounded-[10px] bg-amber-100 px-2 py-0.5 text-[11px] font-bold text-amber-700">
      {{ newEnquiryCount() }} New
    </span>
  }

  <app-admin-header-user-menu />
</header>

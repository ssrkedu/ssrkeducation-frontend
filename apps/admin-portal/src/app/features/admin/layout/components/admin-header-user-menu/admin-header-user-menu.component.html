<div class="flex shrink-0 items-center gap-1 rounded-lg border border-ssrk-border bg-white px-1 py-1 hover:bg-ssrk-bg">
  <button
    type="button"
    class="admin-header-user-trigger flex items-center gap-2 rounded-md border-0 bg-transparent px-1 py-0.5 text-left"
    aria-label="Open user menu"
    aria-haspopup="menu"
    (click)="toggleMenu($event)"
  >
    <p-avatar
      [label]="currentUser()?.initials ?? 'GU'"
      shape="circle"
      styleClass="admin-header-user-avatar"
    />

    <div class="min-w-0 text-left">
      <p
        class="max-w-[5.5rem] truncate text-[12px] font-semibold leading-tight text-ssrk-text-heading sm:max-w-[9rem] sm:text-[13px]"
      >
        {{ displayName() }}
      </p>
      <p
        class="max-w-[5.5rem] truncate text-[10px] leading-tight text-ssrk-text-muted sm:max-w-[9rem] sm:text-[11px]"
      >
        {{ roleLabel() }}
      </p>
    </div>
  </button>

  <p-button
    type="button"
    icon="pi pi-chevron-down"
    styleClass="admin-header-user-toggle"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    ariaLabel="Open user menu"
    (onClick)="toggleMenu($event)"
  />
</div>

<p-menu
  #userMenu
  [model]="menuItems()"
  [popup]="true"
  appendTo="body"
  styleClass="admin-user-menu"
/>

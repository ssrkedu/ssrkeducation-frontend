<app-admin-page-header title="User Management">
  <a routerLink="/users/new">
    <p-button label="Create User" icon="pi pi-plus" styleClass="admin-btn-primary admin-btn-sm" />
  </a>
</app-admin-page-header>

<div class="mb-4">
  <p-iconfield styleClass="admin-filter-search">
    <p-inputicon styleClass="pi pi-search" />
    <input
      pInputText
      type="search"
      placeholder="Search users…"
      class="admin-filter-input"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
    />
  </p-iconfield>
</div>

<section class="admin-card">
  <p-table
    [value]="users()"
    styleClass="admin-table"
    [tableStyle]="{ 'min-width': '60rem' }"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [rowHover]="true"
    sortField="name"
    [sortOrder]="1"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          Name
          <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="email">
          Email
          <p-sortIcon field="email" />
        </th>
        <th pSortableColumn="role">
          Role
          <p-sortIcon field="role" />
        </th>
        <th>Permissions</th>
        <th pSortableColumn="active">
          Status
          <p-sortIcon field="active" />
        </th>
        <th pSortableColumn="lastLogin">
          Last Login
          <p-sortIcon field="lastLogin" />
        </th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr class="cursor-pointer" [routerLink]="['/users', user.id, 'edit']">
        <td>
          <div class="flex items-center gap-2">
            <p-avatar [label]="user.initials" shape="circle" styleClass="admin-user-avatar" />
            <strong>{{ user.name }}</strong>
          </div>
        </td>
        <td class="text-ssrk-text-muted">{{ user.email }}</td>
        <td>
          <app-admin-status-badge
            [label]="user.role === 'super_admin' ? 'Super Admin' : 'Admin'"
            [variant]="user.role === 'super_admin' ? 'super' : 'admin'"
          />
        </td>
        <td class="text-xs text-ssrk-text-muted">
          {{ permissionsLabel(user.permissions, user.role) }}
        </td>
        <td>
          <app-admin-status-badge
            [label]="user.active ? 'Active' : 'Inactive'"
            [variant]="user.active ? 'published' : 'inactive'"
          />
        </td>
        <td class="text-xs text-ssrk-text-muted">{{ user.lastLogin }}</td>
        <td>
          <a [routerLink]="['/users', user.id, 'edit']" (click)="$event.stopPropagation()">
            <p-button label="Edit" styleClass="admin-btn-outline admin-btn-sm" [link]="true" />
          </a>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="py-8 text-center text-ssrk-text-muted">
          No users match your search.
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>

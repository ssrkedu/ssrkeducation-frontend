<div class="mb-4 flex items-center justify-between gap-4">
  <div class="flex items-center gap-3">
    <a routerLink="/cms">
      <p-button label="Back" icon="pi pi-arrow-left" styleClass="admin-btn-outline admin-btn-sm" />
    </a>
    <h1 class="font-serif text-xl font-bold text-ssrk-text-heading">Site Branding</h1>
  </div>
  @if (auth.canWriteCms()) {
    <p-button
      label="Save"
      styleClass="admin-btn-primary admin-btn-sm"
      [loading]="saving()"
      (onClick)="save()"
    />
  }
</div>

@if (errorMessage()) {
  <p class="mb-4 text-sm text-red-700">{{ errorMessage() }}</p>
}

<section class="admin-card mb-4 p-5">
  <h2 class="mb-3 font-serif text-base font-bold">Shared</h2>
  <div class="mb-3">
    <label class="mb-1 block text-sm">Primary color</label>
    <input pInputText class="w-full" [ngModel]="primaryColor()" (ngModelChange)="primaryColor.set($event)" [disabled]="!auth.canWriteCms()" />
  </div>
  <div>
    <label class="mb-1 block text-sm">Logo URL</label>
    <input pInputText class="w-full" [ngModel]="logoUrl()" (ngModelChange)="logoUrl.set($event)" [disabled]="!auth.canWriteCms()" />
  </div>
</section>

<section class="admin-card p-5">
  <p-tabs [value]="activeLanguage()" (valueChange)="activeLanguage.set($event === 'en' ? 'en' : 'or')">
    <p-tablist>
      <p-tab value="en">English (required)</p-tab>
      <p-tab value="or">ଓଡ଼ିଆ</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="en">
        <div class="mt-3 mb-3">
          <label class="mb-1 block text-sm">Site name (English) *</label>
          <input pInputText class="w-full" [ngModel]="englishName()" (ngModelChange)="englishName.set($event)" [disabled]="!auth.canWriteCms()" />
        </div>
        <div>
          <label class="mb-1 block text-sm">Tagline (English)</label>
          <input pInputText class="w-full" [ngModel]="englishTagline()" (ngModelChange)="englishTagline.set($event)" [disabled]="!auth.canWriteCms()" />
        </div>
      </p-tabpanel>
      <p-tabpanel value="or">
        <div class="mt-3 mb-3">
          <label class="mb-1 block text-sm">Site name (Odia)</label>
          <input pInputText class="w-full" [ngModel]="odiaName()" (ngModelChange)="odiaName.set($event)" [disabled]="!auth.canWriteCms()" />
        </div>
        <div>
          <label class="mb-1 block text-sm">Tagline (Odia)</label>
          <input pInputText class="w-full" [ngModel]="odiaTagline()" (ngModelChange)="odiaTagline.set($event)" [disabled]="!auth.canWriteCms()" />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</section>

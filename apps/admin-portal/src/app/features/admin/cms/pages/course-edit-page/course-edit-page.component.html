<div class="mb-6 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <p-button
      icon="pi pi-arrow-left"
      styleClass="admin-btn-ghost admin-btn-sm"
      (onClick)="goBack()"
    />
    <h1 class="font-serif text-xl font-bold text-ssrk-text-heading">{{ pageTitle() }}</h1>
  </div>
  <div class="flex gap-2">
    <p-button label="Save Draft" styleClass="admin-btn-outline admin-btn-sm" (onClick)="saveDraft()" />
    <p-button label="Publish →" styleClass="admin-btn-saffron admin-btn-sm" (onClick)="publish()" />
  </div>
</div>

<div class="grid grid-cols-1 gap-5 xl:grid-cols-[1fr_280px]">
  <div>
    <section class="admin-card mb-4 p-5">
      <h2 class="admin-section-title">Course Content</h2>

      <p-tabs
        [value]="activeLanguage()"
        (valueChange)="setLanguage($event)"
        styleClass="admin-language-tabs"
      >
        <p-tablist>
          <p-tab value="od">
            ଓଡ଼ିଆ (Odia) <span class="text-[10px] text-red-600">*Required</span>
          </p-tab>
          <p-tab value="en">
            English <span class="text-[10px] text-ssrk-text-muted">Optional</span>
          </p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel value="od">
            <div class="admin-auth-field pt-3">
              <label class="admin-auth-label">Course Name (Odia) *</label>
              <input pInputText class="w-full" placeholder="ଯଥା: ବ୍ୟବସାୟ ପରିଚାଳନା ସ୍ନାତକ" fluid />
            </div>
            <div class="admin-auth-field">
              <label class="admin-auth-label">Short Description (Odia)</label>
              <textarea pTextarea rows="3" class="w-full" placeholder="ସଂକ୍ଷିପ୍ତ ବିବରଣ…"></textarea>
            </div>
            <div class="admin-auth-field">
              <label class="admin-auth-label">Full Overview (Odia)</label>
              <textarea pTextarea rows="5" class="w-full" placeholder="ସମ୍ପୂର୍ଣ ବିବରଣ…"></textarea>
            </div>
          </p-tabpanel>

          <p-tabpanel value="en">
            <div class="admin-auth-field pt-3">
              <label class="admin-auth-label">Course Name (English)</label>
              <input pInputText class="w-full" placeholder="e.g. Bachelor of Business Administration" fluid />
            </div>
            <div class="admin-auth-field">
              <label class="admin-auth-label">Short Description (English)</label>
              <textarea pTextarea rows="3" class="w-full" placeholder="Short description…"></textarea>
            </div>
            <div class="admin-auth-field">
              <label class="admin-auth-label">Full Overview (English)</label>
              <textarea pTextarea rows="5" class="w-full" placeholder="Full course overview…"></textarea>
            </div>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </section>

    <section class="admin-card p-5">
      <h2 class="admin-section-title">Eligibility & Syllabus</h2>
      <div class="admin-auth-field">
        <label class="admin-auth-label">Eligibility Criteria</label>
        <textarea pTextarea rows="3" class="w-full" placeholder="e.g. Passed 10+2 with Commerce stream…"></textarea>
      </div>
      <div class="admin-auth-field">
        <label class="admin-auth-label">Career Opportunities</label>
        <textarea pTextarea rows="3" class="w-full" placeholder="Describe career paths…"></textarea>
      </div>
    </section>
  </div>

  <div class="space-y-4">
    <section class="admin-card p-[18px]">
      <h2 class="admin-section-title">Programme Details</h2>
      <div class="admin-auth-field">
        <label class="admin-auth-label">Slug (URL key) *</label>
        <input pInputText class="w-full" placeholder="e.g. b-com" fluid />
        <p class="mt-1 text-[11px] text-ssrk-text-muted">Used in the URL: /courses/b-com</p>
      </div>
      <div class="admin-auth-field">
        <label class="admin-auth-label">Course Code</label>
        <input pInputText class="w-full" placeholder="e.g. B.COM" fluid />
      </div>
      <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
        <div class="admin-auth-field">
          <label class="admin-auth-label">Duration *</label>
          <input pInputText class="w-full" placeholder="3 Years" fluid />
        </div>
        <div class="admin-auth-field">
          <label class="admin-auth-label">Total Seats *</label>
          <p-inputnumber
            inputId="course-seats"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="120"
            [min]="1"
            [fluid]="true"
            [ngModel]="totalSeats()"
            (ngModelChange)="totalSeats.set($event)"
          />
        </div>
      </div>
      <div class="admin-auth-field">
        <label class="admin-auth-label">Approval / Affiliation</label>
        <input pInputText class="w-full" placeholder="Utkal University" fluid />
      </div>
    </section>

    <section class="admin-card p-[18px]">
      <h2 class="admin-section-title">Fee Structure</h2>
      <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
        <div class="admin-auth-field">
          <label class="admin-auth-label">Tuition / Year</label>
          <input pInputText class="w-full" placeholder="₹14,000" fluid />
        </div>
        <div class="admin-auth-field">
          <label class="admin-auth-label">Admission Fee</label>
          <input pInputText class="w-full" placeholder="₹2,500" fluid />
        </div>
        <div class="admin-auth-field">
          <label class="admin-auth-label">Exam Fee / Year</label>
          <input pInputText class="w-full" placeholder="₹2,000" fluid />
        </div>
        <div class="admin-auth-field">
          <label class="admin-auth-label">Total / Year</label>
          <input pInputText class="w-full" placeholder="₹18,500" fluid />
        </div>
      </div>
    </section>

    <section class="admin-card p-[18px]">
      <h2 class="admin-section-title">Visibility</h2>
      <div class="flex items-center gap-2 text-[13px] text-ssrk-text-body">
        <label class="flex cursor-pointer items-center gap-2">
          <p-checkbox
            [binary]="true"
            [ngModel]="published()"
            (ngModelChange)="published.set($event)"
          />
          <span>Published (live on site)</span>
        </label>
      </div>
      <div class="mt-2.5 flex items-center gap-2 text-[13px] text-ssrk-text-body">
        <label class="flex cursor-pointer items-center gap-2">
          <p-checkbox
            [binary]="true"
            [ngModel]="showInList()"
            (ngModelChange)="showInList.set($event)"
          />
          <span>Show in course list</span>
        </label>
      </div>
    </section>
  </div>
</div>

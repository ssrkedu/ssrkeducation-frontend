<main class="flex min-h-screen items-center justify-center bg-ssrk-bg px-4">
  <section class="w-full max-w-md rounded-lg border border-ssrk-border bg-white p-8 shadow-sm">
    <h1 class="font-serif text-2xl font-bold text-ssrk-text-heading">
      SSRK Admin Portal
    </h1>
    <p class="mt-2 text-sm text-ssrk-text-muted">
      Sign in to manage trust and institution content.
    </p>

    <button
      type="button"
      class="mt-8 w-full rounded-sm bg-ssrk-saffron px-4 py-3 text-sm font-semibold text-white transition hover:bg-ssrk-saffron-light"
      (click)="signIn()"
    >
      Continue (dev stub)
    </button>
  </section>
</main>

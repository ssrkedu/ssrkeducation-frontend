<main class="flex min-h-screen items-center justify-center bg-ssrk-bg px-6 py-8">
  <section
    class="w-full max-w-[400px] rounded-ssrk-lg bg-white px-9 py-10 shadow-[0_8px_20px_rgba(13,35,64,0.10),0_2px_6px_rgba(13,35,64,0.05)]"
  >
    <app-auth-brand />

    <h1 class="font-serif text-[21px] font-bold text-ssrk-text-heading">Welcome back</h1>
    <p class="mt-1 mb-6 text-[13px] text-ssrk-text-muted">
      Sign in to manage enquiries, content and users.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage()) {
        <p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-[13px] text-red-700">
          {{ errorMessage() }}
        </p>
      }

      <div class="admin-auth-field">
        <label class="admin-auth-label" for="login-email">Email Address</label>
        <input
          pInputText
          id="login-email"
          type="email"
          formControlName="email"
          placeholder="admin@ssrkedu.com"
          autocomplete="username"
          class="w-full"
          fluid
        />
      </div>

      <div class="admin-auth-field">
        <label class="admin-auth-label" id="login-password-label">Password</label>
        <p-password
          formControlName="password"
          placeholder="Your password"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
          [toggleMask]="true"
          [feedback]="false"
          [fluid]="true"
          ariaLabelledBy="login-password-label"
        />

      </div>

      <p-button
        type="submit"
        label="Sign In →"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
        styleClass="admin-auth-submit w-full"
      />

      <div class="mt-3 text-center">
        <a
          routerLink="/auth/forgot-password"
          class="text-[12px] font-semibold text-ssrk-blue-primary hover:underline"
        >
          Forgot password?
        </a>
      </div>
    </form>
  </section>
</main>

<main class="flex min-h-screen items-center justify-center bg-ssrk-bg px-6 py-8">
  <section
    class="w-full max-w-[400px] rounded-ssrk-lg bg-white px-9 py-10 shadow-[0_8px_20px_rgba(13,35,64,0.10),0_2px_6px_rgba(13,35,64,0.05)]"
  >
    <app-auth-brand />

    <h1 class="font-serif text-[21px] font-bold text-ssrk-text-heading">Reset password</h1>
    <p class="mt-1 mb-6 text-[13px] text-ssrk-text-muted">
      Enter your email and we'll send a reset OTP.
    </p>

    @if (submitted()) {
      <p-message severity="success" styleClass="admin-inline-message mb-4 w-full">
        OTP sent! Check your inbox. (demo)
      </p-message>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="admin-auth-field">
          <label class="admin-auth-label" for="forgot-email">Email Address</label>
          <input
            pInputText
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="admin@ssrkedu.com"
            autocomplete="username"
            class="w-full"
            fluid
            [invalid]="isInvalid()"
          />
          @if (isInvalid()) {
            <small class="admin-auth-error">Enter a valid email address.</small>
          }
        </div>

        <p-button
          type="submit"
          label="Send OTP →"
          [loading]="isSubmitting()"
          [disabled]="isSubmitting()"
          styleClass="admin-auth-submit w-full"
        />
      </form>
    }

    <div class="mt-3 text-center">
      <a
        routerLink="/auth/login"
        class="text-[12px] font-semibold text-ssrk-blue-primary hover:underline"
      >
        ← Back to login
      </a>
    </div>
  </section>
</main>
